  - id: billing-missing-secret
    question: billing will not start after this morning's release
    namespace: shop
    minutes: 60
    fixture:
      deployments:
        - {name: billing, replicas: 1, ready: 0}
      rollouts:
        billing:
          - {revision: 6, minutes_ago: 12, images: ["shop/billing:7.0.0"]}
          - {revision: 5, minutes_ago: 8000, images: ["shop/billing:6.9.2"]}
      pods:
        - deployment: billing
          revision: 6
          index: 0
          waiting: CreateContainerConfigError
          message: 'secret "billing-db" not found'
          ready: false
          env: [{name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: billing-db, key: password}}}]
      services:
        - {name: billing, selector: {app: billing}}
      events:
        - {reason: Failed, object: Pod/billing, message: 'Error: secret "billing-db" not found', minutes_ago: 10, count: 8}
      loki: []
      commits:
        - {message: "billing: read the database password from a new Secret", minutes_ago: 30, files: ["deploy/billing.yaml"]}
    expect:
      root_cause: missing_config_reference
      acceptable: [deployment_regression, crashloop_startup_failure]
      root_cause_words: ["secret", "billing-db", "configuration", "not found"]
      acceptable_words: ["deploy", "release", "rollout", "start-up"]
      forbidden: [oom_memory_limit, dns_failure, connection_pool_exhaustion, image_pull_failure]
      forbidden_words: ["out of memory", "\\bDNS\\b", "connection pool", "image pull"]
      evidence_sources: [kubernetes, deployment, configuration, git]
