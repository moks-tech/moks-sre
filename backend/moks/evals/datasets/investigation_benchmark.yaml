      rollouts:
        web:
          - {revision: 4, minutes_ago: 30000, images: ["shop/web:1.2.0"]}
      pods:
        - {deployment: web, index: 0}
        - {deployment: web, index: 1}
      services:
        - {name: web, selector: {app: web}}
      loki: []
