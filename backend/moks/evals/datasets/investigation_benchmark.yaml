        request_rate: {web: {base: 60}}
        latency_p95: {web: {base: 0.09}}
        errors_rate: {web: {base: 0.0, noise: 0.0}}
        cpu_cores: {web: {base: 0.2}}
        cpu_throttled_ratio: {web: {base: 0.0, noise: 0.0}}
