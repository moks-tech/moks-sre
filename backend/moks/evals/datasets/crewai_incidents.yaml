          - {match: redis_up, metric: {instance: redis-cart-0}, values: [[60, 1], [22, 0], [2, 0]]}
          - {match: 'response_code=~', metric: {}, values: [[60, 0.0], [20, 0.31], [2, 0.3]]}
          - {match: istio_requests_total, unless: ['response_code=~'], metric: {}, values: [[60, 60], [2, 58]]}
      loki:
        - {pod: cart-59d-a1, minutes_ago: 1, line: "level=error msg=\"redis: dial tcp 10.0.3.7:6379: connect: connection refused\""}
