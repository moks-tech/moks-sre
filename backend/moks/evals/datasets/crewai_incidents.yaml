        tools: [evidence_list]
        answer:
          hypotheses:
            - {statement: "cart cannot reach Redis at 10.0.3.7:6379 (connection refused; redis_up is 0), so requests that need the cache fail", cite: [loki_search, prom_metric, prom_service_signals],
               would_confirm: "the Redis pod's state"}

  - id: rabbitmq-queue-backlog
    title: RabbitMQ queue backlog
    namespace: shop
    workload: worker
    question: orders are processed hours late
    change_window: 6h
    fixture:
      pods:
        - {name: worker-2b7-a1, labels: {app: worker}}
      deployments:
        - {name: worker, replicas: 1, ready: 1}
      rollouts:
        worker:
          - {revision: 3, minutes_ago: 9000, images: ["registry/worker:1.1"], replica_set: worker-2b7}
      scaled_objects:
        - {name: worker-scaler, target: worker, min: 1, max: 20, paused: true, triggers: [rabbitmq], conditions: [{type: Ready, status: "True"}, {type: Paused, status: "True"}]}
      prometheus:
        series:
