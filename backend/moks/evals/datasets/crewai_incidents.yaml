            - {observation: "redis_up for redis-cart-0 has been 0 for about 20 minutes", resource: redis-cart-0, cite: [prom_metric]}
            - {observation: "30% of cart's requests fail with 5xx", resource: Deployment/cart, cite: [prom_service_signals]}
