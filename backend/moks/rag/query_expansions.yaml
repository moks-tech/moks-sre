# Query expansion for knowledge search (MOKS_RAG_QUERY_EXPANSION, off by default).
# A phrase on the left, matched as a whole word in the question, adds the terms on the right to ONE extra keyword
# ranking beside the question's own. The question, its identifiers and its vector never change, so an expansion can
# add candidates but cannot remove a match. Keep each list short and specific: a broad term ranks everything.
expansions:
  restarting: [CrashLoopBackOff, restartCount, OOMKilled, liveness probe]
  restarts: [CrashLoopBackOff, restartCount, OOMKilled]
  keeps dying: [CrashLoopBackOff, OOMKilled, exit code]
  crashing: [CrashLoopBackOff, exit code, OOMKilled]
  out of memory: [OOMKilled, memory limit, exit code 137]
  killed: [OOMKilled, SIGKILL, exit code 137]
  won't start: [CrashLoopBackOff, ImagePullBackOff, Pending]
  never start: [Pending, FailedScheduling, ImagePullBackOff]
  slow: [latency, p99, histogram_quantile, timeout]
  latency: [p99, histogram_quantile, http_request_duration_seconds]
  timeouts: [504, deadline exceeded, idle timeout]
  can't resolve: [DNS, CoreDNS, NXDOMAIN]
  no such host: [DNS, CoreDNS, ndots]
  access denied: [AccessDenied, IAM policy, trust policy]
  permission: [IAM, RBAC, AccessDenied]
  no space left: [disk full, DiskPressure, ephemeral-storage]
  disk full: [DiskPressure, no space left on device]
  lock: [state lock, force-unlock, lock-timeout]
  holding it: [state lock, force-unlock]
  drift: [refresh-only, plan, ignore_changes]
  certificate: [cert-manager, x509, ACME]
  expired: [x509, certificate, renewal]
  missing logs: [Loki, ingestion rate limit, 429]
  logs disappeared: [Loki, ingestion rate limit, dropped]
  missing traces: [sending_queue, propagation, sampling]
  traces missing: [sending_queue, propagation, sampling]
  no data: [scrape, up == 0, $__rate_interval]
  k8s: [kubernetes]
  kube: [kubernetes]
  tf: [terraform]
  otel: [opentelemetry]
  promql: [prometheus]
  logql: [loki]
  hpa: [HorizontalPodAutoscaler]
  pdb: [PodDisruptionBudget]
  pvc: [PersistentVolumeClaim]
  irsa: [AssumeRoleWithWebIdentity, service account role]
