# Add to the Prometheus rule files in the tools repository (kubernetes: deploy/minikube/observability/prometheus/files/alerts.yml),
# after adding the scrape job in prometheus-scrape.yaml. Without both, and a route to a person, these alerts notify no one; the
# Overview page shows the same backup warning without them. Every MOKS process exports the durability gauges, but only a worker
# sets them, so those rules take max() over the job: one alert, not one per pod.
groups:
  # MOKS's own health: the portal, its agent runs and the dependencies they use. Not the clusters MOKS investigates.
  - name: moks
    rules:
      - alert: MoksMetricsDown
        expr: up{job="moks"} == 0 or absent(up{job="moks"})
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: 'MOKS pod {{ $labels.instance }} is not answering metrics scrapes (or no MOKS pod is found)'
      - alert: MoksApiErrors
        expr: sum(rate(moks_http_requests_total{job="moks", status=~"5.."}[10m])) / sum(rate(moks_http_requests_total{job="moks"}[10m])) > 0.05
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'More than 5% of MOKS API requests fail with 5xx'
          description: 'Loki: {namespace="moks-sre"} | logfmt | event="http_request" | status=~"5.." gives trace ids to open in Jaeger.'
      - alert: MoksModelCallsFailing
        expr: sum by (provider) (rate(moks_llm_requests_total{job="moks", outcome!="ok"}[15m])) / sum by (provider) (rate(moks_llm_requests_total{job="moks"}[15m])) > 0.5
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'Over half of {{ $labels.provider }} model calls fail; investigations fall back to rule-based reports'
          description: 'The outcome label is the failure kind (auth, timeout, rate_limited, unavailable, budget, refused, bad_response).'
      - alert: MoksInvestigationsFailing
        expr: sum(increase(moks_investigations_total{job="moks", outcome="failed"}[1h])) >= 3 and sum(increase(moks_investigations_total{job="moks", outcome="failed"}[1h])) / sum(increase(moks_investigations_total{job="moks"}[1h])) > 0.3
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'More than 30% of MOKS investigations failed in the last hour'}
      - alert: MoksToolCallsFailing
        expr: sum by (tool) (rate(moks_tool_calls_total{job="moks", outcome!~"ok|invalid_args"}[15m])) / sum by (tool) (rate(moks_tool_calls_total{job="moks"}[15m])) > 0.5 and sum by (tool) (increase(moks_tool_calls_total{job="moks"}[15m])) >= 5
        for: 15m
        labels: {severity: warning}
        annotations: {summary: 'MOKS tool {{ $labels.tool }} fails more than half the time; check its connector'}
      - alert: MoksJobsWaiting
        expr: max by (job_class) (moks_jobs_oldest_age_seconds{job="moks"}) > 900
        for: 10m
        labels: {severity: warning}
        annotations: {summary: 'A due {{ $labels.job_class }} job has waited over 15 minutes; check the moks-worker pod'}
  - name: moks-durability
    rules:
      - alert: MoksBackupOverdue
        expr: time() - max(moks_backup_last_success_timestamp_seconds{job="moks"}) > 10800
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: No successful MOKS backup for over 3 hours
          description: Also fires when no backup has ever succeeded. Check the moks-backup CronJob. Data written since the last backup would be lost in a disaster.
      - alert: MoksBackupFailed
        expr: max(moks_backup_last_run_success{job="moks"}) == 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: The latest MOKS backup run failed}
      - alert: MoksDatabaseVolumeFilling
        expr: max(moks_database_size_bytes{job="moks"}) / max(moks_database_volume_bytes{job="moks"}) > 0.7
        for: 30m
        labels: {severity: warning}
        annotations: {summary: The MOKS database has used over 70% of its volume}
      - alert: MoksDatabaseVolumeNearlyFull
        expr: max(moks_database_size_bytes{job="moks"}) / max(moks_database_volume_bytes{job="moks"}) > 0.85
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: The MOKS database has used over 85% of its volume
          description: PostgreSQL stops accepting writes when the volume fills, and this StorageClass cannot expand.
  # From the worker's probe of an external search cluster (rag.backend opensearch), so these work without the exporter. A missing
  # series means no worker is probing. With rag.backend postgres (mk4) only MoksRetrievalFallingBack applies.
  - name: moks-search
    rules:
      - alert: MoksSearchDown
        expr: moks_search_backend{metric="up"} == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: The worker cannot reach the search cluster
          description: Search falls back to PostgreSQL keyword search and says so. Indexing waits in the outbox.
      - alert: MoksSearchNotGreen
        expr: moks_search_backend{metric="health"} < 2
        for: 15m
        labels: {severity: warning}
        annotations: {summary: Search cluster health is not green}
      - alert: MoksSearchWriteBlocked
        expr: moks_search_backend{metric="read_only"} == 1
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: OpenSearch has blocked writes
          description: Usually the flood-stage watermark. All mk4 nodes share one disk. The block lifts when disk frees.
      - alert: MoksSearchDiskLow
        expr: moks_search_backend{metric="disk_free_bytes"} < 5e9
        for: 10m
        labels: {severity: warning}
        annotations: {summary: Under 5 GB free on the disk OpenSearch shares}
      - alert: MoksSearchHeapHigh
        expr: moks_search_backend{metric="heap_used_percent"} > 85
        for: 15m
        labels: {severity: warning}
        annotations: {summary: OpenSearch heap above 85% for 15 minutes}
      - alert: MoksSearchRejecting
        expr: rate(moks_search_backend{metric=~"search_rejected_total|write_rejected_total"}[10m]) > 0
        for: 10m
        labels: {severity: warning}
        annotations: {summary: OpenSearch is rejecting requests}
      - alert: MoksIndexDeadLetters
        expr: moks_search_backend{metric="outbox_dead"} > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Index changes gave up after all retries
          description: Search still answers from PostgreSQL's truth. Retry from Knowledge after fixing the cause.
      - alert: MoksIndexFallingBehind
        expr: moks_search_backend{metric="documents_behind"} > 0
        for: 30m
        labels: {severity: warning}
        annotations: {summary: Documents have been behind the index for 30 minutes}
      - alert: MoksVectorCoverageLow
        expr: moks_search_backend{metric="vector_coverage"} < 0.95
        for: 1h
        labels: {severity: warning}
        annotations: {summary: Under 95% of documents have vectors; search is keyword only for the rest}
      - alert: MoksSnapshotOverdue
        expr: moks_search_backend{metric="last_snapshot_seconds"} > 0 and time() - moks_search_backend{metric="last_snapshot_seconds"} > 129600
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: No successful OpenSearch snapshot for 36 hours
          description: The index can still be rebuilt from PostgreSQL, at the cost of re-embedding everything.
      - alert: MoksRetrievalFallingBack
        expr: rate(moks_retrieval_fallbacks_total[15m]) > 0
        for: 15m
        labels: {severity: warning}
        annotations: {summary: Searches are being answered with less than was asked for}
  # About MOKS's own ML, never about the workloads it watches: anomalies are shadow output and page no one.
  - name: moks-ml
    rules:
      - alert: MoksMLModelInvalid
        expr: increase(moks_ml_fallbacks_total{capability="anomaly_detection", reason="model_invalid"}[1h]) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: An anomaly model failed its artifact checks and is not scoring
          description: Checksum, format, schema or structure. Roll the cohort back or retrain it (docs/ML.md, Roll back).
      - alert: MoksMLChampionNeedsReview
        expr: max by (algorithm, reason) (moks_ml_model_degraded) == 1
        for: 2h
        labels: {severity: info}
        annotations:
          summary: An anomaly champion's health check recommends a review
          description: Flag rate above its gate, input drift, judged precision below 0.7, or a stale schema. Settings > Machine learning > Models shows which and why.
      - alert: MoksMLContextUnreadable
        expr: sum by (source) (increase(moks_ml_context_gaps_total[1h])) > 10
        for: 1h
        labels: {severity: info}
        annotations:
          summary: Correlation keeps failing to read context from one source
          description: Groups still form, with fewer links. Check the connector and the automation principal's bindings.
