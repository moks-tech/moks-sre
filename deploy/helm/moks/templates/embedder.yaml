{{- if include "moks.inGroup" (dict "root" . "group" "reranker") }}
{{- with .Values.embedder }}
{{- if .enabled }}
{{- if and .image.digest (not (regexMatch "^sha256:[0-9a-f]{64}$" (toString .image.digest))) -}}{{- fail "embedder.image.digest must be sha256:<64 hex characters>; use embedder.image.tag for a tag" -}}{{- end }}
{{- if not (or .image.digest .image.tag) -}}{{- fail "embedder.image.tag or embedder.image.digest is required" -}}{{- end }}
# Internal embedding model service (docs/EMBEDDINGS.md): the reranker's image built around embedder.lock.json, in
# the reranker Argo CD app with it. It answers POST /embed and GET /info as Text Embeddings Inference does, for an
# embedding configuration with provider huggingface. No Ingress, no Kubernetes API access and no outbound network:
# the model is in the image, and this pod only ever answers the API and worker.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: moks-embedder
  labels: {{- include "moks.labels" $ | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: moks-embedder
  labels: {{- include "moks.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app: moks-embedder}
  ports:
    - {name: http, port: 8090, targetPort: 8090}
---
# Headless, for Prometheus (job moks): its sidecar sends mTLS only to pod addresses a Service names, and this pod's
# :9464 is STRICT once mesh.metricsMtls is true. Without it the scrape is plain text and the sidecar here resets it.
apiVersion: v1
kind: Service
metadata:
  name: moks-embedder-metrics
  labels: {{- include "moks.labels" $ | nindent 4 }}
spec:
  clusterIP: None
  selector: {app: moks-embedder}
  ports:
    - {name: metrics, port: 9464, targetPort: 9464}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moks-embedder
  labels: {{- include "moks.labels" $ | nindent 4 }}
    app.kubernetes.io/component: embedder
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels: {app: moks-embedder}
  template:
    metadata:
      labels: {app: moks-embedder}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
    spec:
      serviceAccountName: moks-embedder
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ add .drainSeconds 10 }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: embedder
          image: {{ .image.repository }}{{ if .image.digest }}@{{ .image.digest }}{{ else }}:{{ .image.tag }}{{ end }}
          imagePullPolicy: {{ if .image.digest }}IfNotPresent{{ else }}Always{{ end }}
          {{- include "moks.containerSecurity" $ | nindent 10 }}
          env:
            - {name: RERANKER_THREADS, value: {{ .threads | quote }}}
            - {name: RERANKER_BATCH_SIZE, value: {{ .batchSize | quote }}}
            - {name: RERANKER_CONCURRENCY, value: {{ .concurrency | quote }}}
            - {name: RERANKER_QUEUE, value: {{ .queue | quote }}}
            - {name: EMBEDDER_MAX_INPUTS, value: {{ .maxInputs | quote }}}
            - {name: EMBEDDER_MAX_INPUT_CHARS, value: {{ .maxInputChars | quote }}}
            - {name: EMBEDDER_TIMEOUT_MS, value: {{ .timeoutMs | quote }}}
            - {name: RERANKER_DRAIN_SECONDS, value: {{ .drainSeconds | quote }}}
            # The embedding configuration in MOKS sends this as its API key (credential {{ .tokenKey }}).
            - name: RERANKER_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .tokenSecret }}, key: {{ .tokenKey }}}
          ports:
            - {name: http, containerPort: 8090}
            - {name: metrics, containerPort: 9464}
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources: {{- toYaml .resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
{{- if $.Values.networkPolicy.enabled }}
---
# Only the API and the worker reach this. It starts nothing outbound, so it needs no egress at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: moks-embedder
  labels: {{- include "moks.labels" $ | nindent 4 }}
spec:
  podSelector: {matchLabels: {app: moks-embedder}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: moks, component: api}}
        - podSelector: {matchLabels: {app: moks, component: worker}}
      ports: [{port: 8090, protocol: TCP}]
    {{- with $.Values.networkPolicy.metricsNamespaces }}
    - from:
        {{- range . }}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ . }}}}
        {{- end }}
      ports: [{port: 9464, protocol: TCP}]
    {{- end }}
  egress: []
{{- end }}
{{- if $.Values.istio.mtls }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: moks-embedder
  labels: {{- include "moks.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels: {app: moks-embedder}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/{{ $.Release.Namespace }}/sa/{{ include "moks.serviceAccount" (dict "root" $ "component" "api") }}
              - cluster.local/ns/{{ $.Release.Namespace }}/sa/{{ include "moks.serviceAccount" (dict "root" $ "component" "worker") }}
      to:
        - operation:
            ports: ["8090"]
{{- end }}
{{- end }}
{{- end }}
{{- end }}
